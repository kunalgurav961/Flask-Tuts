{% extends "base.html" %}

{% block title %}
Contact Us
{% endblock %}


{% block content %}

<h1>Contact Us</h1>

{% if success %}
    <p style="color: green;">
        {{ success }}
    </p>
{% endif %}

<form method="POST">

    <label for="name">Name</label>
    <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
    >

    <br><br>

    <label for="email">Email</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <br><br>

    <label for="message">Message</label>
    <textarea
        id="message"
        name="message"
        rows="5"
        placeholder="Enter your message"
        required
    ></textarea>

    <br><br>

    <button type="submit">
        Send Message
    </button>

</form>

{% endblock %}
